[project]
name = "attest-voice"
version = "0.1.0"
description = "Reference voice producer for attest: diarization, voiceprint evidence, word attribution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "numpy>=2.5.4",
    "sherpa-onnx>=2.0.1",
]

[project.scripts]
attest-voice = "attest_voice.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>attest · Maple House</title>
<style>
:root {
  color-scheme: light;
  --bg: #fbfbfa; --pane: #ffffff; --sunk: #f3f3f1;
  --ink: #141415; --ink-2: #505257; --ink-3: #6b6e74;
  --rule: #e6e6e3; --rule-2: #d3d3cf; --faint: #d0d0cc;
  --live: #5232e8; --live-soft: rgba(82,50,232,.14);
  --ok: #17763a; --no: #c0352b; --warn: #8f5c00;
  --shadow: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px -8px rgba(0,0,0,.10);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --rail: 212px; --detail: 452px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0c0d; --pane: #161618; --sunk: #121214;
  --ink: #ededee; --ink-2: #a8aab0; --ink-3: #8a8d94;
  --rule: #232326; --rule-2: #313136; --faint: #3a3a40;
  --live: #a08fff; --live-soft: rgba(160,143,255,.18);
  --ok: #4fc27c; --no: #ff7d70; --warn: #e3aa45;
  --shadow: 0 0 0 1px rgba(255,255,255,.06), 0 16px 40px -8px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--sans); font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; }
.num, time, td.n { font-variant-numeric: tabular-nums; }
code, .mono { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: -.012em; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
h3 { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.lede { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
.sub { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.small { font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; }
.rail { border-right: 1px solid var(--rule); display: flex; flex-direction: column; padding: 14px 10px 12px; gap: 14px; overflow: auto; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px 0; }
.brand b { font-weight: 600; font-size: 15px; letter-spacing: -.02em; }
.brand span { color: var(--ink-3); font-size: 12.5px; }
.jump { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--rule); background: transparent; border-radius: 6px; color: var(--ink-3); cursor: pointer; text-align: left; }
.jump kbd { margin-left: auto; }
kbd { font: 500 11px var(--sans); color: var(--ink-3); border: 1px solid var(--rule-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; min-width: 18px; text-align: center; display: inline-block; line-height: 16px; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 6px; text-decoration: none; color: var(--ink-2); }
.nav a:hover { background: var(--sunk); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--sunk); font-weight: 500; }
.nav a[aria-current="page"]::before { content: ""; width: 2px; height: 14px; background: var(--ink); border-radius: 2px; margin-left: -8px; margin-right: -4px; }
.nav .tail { margin-left: auto; font-size: 12px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 5px; }
.nav .tail.live { color: var(--ink-2); }
.rail-foot { margin-top: auto; display: grid; gap: 2px; border-top: 1px solid var(--rule); padding-top: 10px; }
.me { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 0; font-size: 12.5px; color: var(--ink-3); }
.linkbtn { background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }
.linkbtn:hover, a.x:hover { color: var(--ink); text-decoration-color: currentColor; }
a.x { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule-2); text-underline-offset: 3px; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 22px 32px 18px; border-bottom: 1px solid var(--rule); }
.ph-act { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.md { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) var(--detail); min-height: 0; }
.md.solo { grid-template-columns: minmax(0,1fr); }
.master { overflow: auto; padding: 8px 32px 48px; min-width: 0; }
.detail { overflow: auto; background: var(--pane); box-shadow: var(--shadow); padding: 22px 28px 48px; position: relative; z-index: 1; }
.back { display: none; }
.empty-detail { color: var(--ink-3); padding-top: 40vh; text-align: center; }

/* buttons */
.btn { height: 32px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule-2); background: transparent; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.primary[disabled] { background: transparent; color: var(--ink-3); border-color: var(--rule-2); cursor: default; opacity: 1; }
.btn.danger { color: var(--no); border-color: currentColor; }
.btn.quiet { border-color: transparent; color: var(--ink-2); padding: 0 8px; }

/* ---------- Glyphs ---------- */
.lv { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.ladder { flex: none; overflow: visible; }
.ladder .r { stroke: var(--rule-2); stroke-width: 1; }
.ladder .g { fill: var(--faint); }
.ladder .g.on { fill: currentColor; }
.oc { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); }
.oc svg { flex: none; }
.oc.ok svg { color: var(--ok); } .oc.no svg { color: var(--no); } .oc.warn svg { color: var(--warn); }
.att { display: inline-flex; gap: 6px; align-items: baseline; color: var(--ink); }
.att svg { color: var(--warn); flex: none; position: relative; top: 2px; }
.dotlive { width: 6px; height: 6px; border-radius: 50%; background: var(--live); display: inline-block; box-shadow: 0 0 0 3px var(--live-soft); }

/* ---------- Lists ---------- */
.group { margin-top: 18px; }
.ghead { display: flex; align-items: baseline; gap: 10px; padding: 10px 0 6px; border-bottom: 1px solid var(--rule); }
.ghead h2 { font-size: 13.5px; }
.ghead .meta { color: var(--ink-3); font-size: 12.5px; }
.ghead .meta.end { margin-left: auto; }
.row { display: grid; align-items: center; gap: 16px; min-height: 44px; padding: 6px 10px; margin: 0 -10px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; border-radius: 0; position: relative; }
a.row:hover { background: var(--sunk); }
a.row[aria-current="true"] { background: var(--sunk); }
a.row[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--ink); border-radius: 2px; }
.row .name { font-weight: 500; }
.row .end { justify-self: end; text-align: right; }
.colhead { display: grid; gap: 16px; padding: 14px 0 6px; font-size: 11.5px; color: var(--ink-3); border-bottom: 1px solid var(--rule); }
.r-pres { grid-template-columns: minmax(110px,1fr) 112px 116px minmax(170px,200px) 128px; }
.r-dec { grid-template-columns: 64px 86px minmax(0,1fr) 104px; }
.r-id { grid-template-columns: minmax(140px,1fr) 100px 92px 92px 96px 90px; }
.r-sen { grid-template-columns: minmax(150px,1fr) 64px minmax(110px,150px) 128px 92px; }
.r-ag { grid-template-columns: minmax(140px,1fr) 160px 100px 190px; }
.r-gov { grid-template-columns: minmax(0,1fr) auto; }
.who-not { color: var(--ink-2); font-weight: 400 !important; }
.fresh { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.until { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
.note { color: var(--ink-3); font-size: 12.5px; padding: 12px 0; }
.mod { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; }
.mod.off { color: var(--ink-3); }

/* ---------- Detail anatomy ---------- */
.dh { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; }
.dh .kicker { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.sec { padding: 16px 0; border-top: 1px solid var(--rule); }
.sec > h3 { margin-bottom: 10px; }
.kv { display: grid; grid-template-columns: 128px 1fr; gap: 7px 14px; font-size: 13.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.lines li:last-child { border-bottom: 0; }
.lines .rt { margin-left: auto; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; text-align: right; }
.consequence { margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--warn); font-size: 13.5px; }
.consequence.plain { border-left-color: var(--rule-2); color: var(--ink-2); }

/* ---------- Belief trace ---------- */
.trace { display: block; overflow: visible; }
.trace.big { width: 100%; height: auto; max-width: 560px; }
h1:focus, .detail:focus { outline: none; }
.trace .th { stroke: var(--rule-2); stroke-width: 1; }
.trace .th.d { stroke-dasharray: 2 3; }
.trace .tl { fill: var(--ink-3); font: 500 10px var(--sans); }
.trace .ax { fill: var(--ink-3); font: 400 10px var(--sans); }
.trace .past { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trace .fut { fill: none; stroke: var(--ink-3); stroke-width: 1.5; stroke-dasharray: 2 4; stroke-linecap: round; }
.trace .area { fill: var(--ink); opacity: .045; }
.trace .base { stroke: var(--rule-2); }
.trace .nowl { stroke: var(--live); stroke-width: 1; opacity: .55; }
.trace .head { fill: var(--live); }
.trace .halo { fill: var(--live); opacity: .25; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
.trace .tk-v { stroke: var(--ink-2); stroke-width: 1.5; stroke-linecap: round; }
.trace .tk-f { fill: var(--ink-2); }
.trace .tk-x { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
.trace .hov { stroke: var(--ink-3); stroke-width: 1; }
.mini .th { stroke: var(--rule); }
.mini .past { stroke-width: 1.5; }
@keyframes halo { from { transform: scale(1); opacity: .35; } to { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .trace .halo { animation: none; display: none; } }
.still .trace .halo { animation: none; display: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.readout { font-size: 12.5px; color: var(--ink-2); min-height: 18px; margin-top: 2px; }
.bigstate { display: flex; align-items: baseline; gap: 14px; margin: 2px 0 14px; flex-wrap: wrap; }
.bigstate .lv { font-size: 17px; font-weight: 500; }

/* ---------- Decision record ---------- */
.sentence { font-size: 17px; line-height: 1.4; font-weight: 500; letter-spacing: -.008em; margin: 6px 0 4px; }
.chain { list-style: none; margin: 14px 0 0; padding: 0; counter-reset: c; }
.chain li { display: grid; grid-template-columns: 22px 78px 1fr; gap: 10px; padding: 9px 0; position: relative; font-size: 13.5px; }
.chain li::before { content: ""; position: absolute; left: 10.5px; top: 28px; bottom: -9px; width: 1px; background: var(--rule-2); }
.chain li:last-child::before { display: none; }
.chain .st { width: 22px; height: 20px; display: grid; place-items: center; background: var(--pane); position: relative; z-index: 1; }
.chain .k { color: var(--ink-3); font-size: 12.5px; padding-top: 1px; }
.chain .v b { font-weight: 500; }
.chain .v .sub { display: block; font-size: 12.5px; margin-top: 1px; }
.chain li.fail .v b { color: var(--ink); }
.chain li.skip .v { color: var(--ink-3); }
details.numbers { margin-top: 14px; border-top: 1px solid var(--rule); }
details.numbers summary { cursor: pointer; padding: 12px 0 6px; color: var(--ink-2); font-size: 13px; list-style: none; display: flex; gap: 8px; align-items: center; }
details.numbers summary::-webkit-details-marker { display: none; }
details.numbers summary::before { content: "›"; display: inline-block; transition: transform .15s; color: var(--ink-3); }
details.numbers[open] summary::before { transform: rotate(90deg); }
table.raw { width: 100%; border-collapse: collapse; font: 12px var(--mono); color: var(--ink-2); margin-top: 6px; }
table.raw th { text-align: left; font: 500 11px var(--sans); color: var(--ink-3); padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); }
table.raw td { white-space: nowrap; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.reasons { margin: 10px 0 0; padding: 0; list-style: none; font: 12px/1.7 var(--mono); color: var(--ink-2); }
.reasons li::before { content: "· "; color: var(--ink-3); }
.reasons li.f { color: var(--no); }

.filters { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; padding: 12px 0 4px; font-size: 13px; color: var(--ink-3); }
.filters label { display: inline-flex; align-items: center; gap: 6px; }
.filters select, .sel { font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); padding: 3px 18px 3px 0; appearance: none; -webkit-appearance: none; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-size: 4px 4px; background-position: calc(100% - 7px) 55%, calc(100% - 3px) 55%; background-repeat: no-repeat; }
.filters select option, .sel option { background: var(--pane); color: var(--ink); }
.filters .count { margin-left: auto; }

/* ---------- Policy matrix ---------- */
.impact { padding: 12px 32px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; font-size: 13.5px; }
.impact.idle { color: var(--ink-3); }
.impact .chg { display: flex; gap: 10px; align-items: baseline; }
.impact .chg .tag { font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); flex: none; width: 66px; }
table.mx { width: 100%; border-collapse: collapse; margin-top: 8px; }
table.mx th { font-size: 11.5px; font-weight: 400; color: var(--ink-3); text-align: left; padding: 12px 8px 7px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: bottom; }
table.mx th.role { text-align: center; width: 84px; }
table.mx th.role span { display: block; font-size: 11px; }
table.mx th.role b { display: block; color: var(--ink); font-weight: 500; font-size: 12.5px; }
table.mx td { border-bottom: 1px solid var(--rule); padding: 0 8px; height: 46px; }
table.mx tr.cur td { background: var(--sunk); }
table.mx tr.cur td:first-child { box-shadow: inset 2px 0 0 var(--ink); }
table.mx td.act a { text-decoration: none; display: block; padding: 6px 0; }
table.mx td.act a b { font-weight: 500; display: block; white-space: nowrap; }
table.mx th.needh { width: 150px; } table.mx th.wh { width: 168px; }
table.mx td.act code { font-size: 11px; color: var(--ink-3); }
table.mx td.cell { text-align: center; padding: 0; }
table.mx td.floor { color: var(--ink-3); font-size: 12.5px; text-align: center; }
table.mx tr.sec-row td { height: auto; padding: 18px 8px 6px; border-bottom: 1px solid var(--rule); }
.hold { width: 100%; height: 45px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 0; }
.hold:hover { background: var(--sunk); }
.hold svg circle { stroke: var(--ink-2); }
.hold[aria-pressed="true"] svg circle { fill: var(--ink); stroke: var(--ink); }
.hold.changed { box-shadow: inset 0 -2px 0 var(--ink); }
.need { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; margin-left: -8px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; }
.need:hover, .need[aria-expanded="true"] { border-color: var(--rule-2); }
.need .chev { color: var(--ink-3); margin-left: 2px; }
.need.changed { box-shadow: inset 0 -2px 0 var(--ink); border-radius: 6px 6px 0 0; }
.where { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.menu { position: absolute; z-index: 30; background: var(--pane); box-shadow: var(--shadow); border-radius: 8px; padding: 4px; width: 300px; }
.menu [role="option"] { display: grid; grid-template-columns: 18px 1fr; gap: 2px 10px; padding: 8px 10px; border-radius: 5px; cursor: pointer; align-items: center; }
.menu [role="option"] small { grid-column: 2; color: var(--ink-3); font-size: 12px; }
.menu [role="option"][aria-selected="true"] b::after { content: " · current"; font-weight: 400; color: var(--ink-3); }
.menu [role="option"].hi, .menu [role="option"]:hover { background: var(--sunk); }
.levels { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; font-size: 13.5px; align-items: center; }
.reach { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 16px; }

/* ---------- Coverage map ---------- */
.cov { width: 100%; border-collapse: collapse; margin-top: 6px; }
.cov th { font-size: 11.5px; font-weight: 400; color: var(--ink-3); text-align: left; padding: 10px 12px 7px 0; border-bottom: 1px solid var(--rule); }
.cov td { padding: 0 12px 0 0; border-bottom: 1px solid var(--rule); height: 52px; vertical-align: middle; font-size: 13.5px; }
.cov td.sp { font-weight: 500; width: 140px; }
.cov td.m { width: 24%; }
.seg { display: block; height: 3px; border-radius: 2px; background: var(--ink); margin-bottom: 7px; width: 100%; max-width: 180px; }
.seg.gap { background: repeating-linear-gradient(90deg, var(--faint) 0 3px, transparent 3px 7px); }
.seg.off { background: repeating-linear-gradient(90deg, var(--warn) 0 6px, transparent 6px 9px); }
.cov .cap { color: var(--ink-2); font-size: 12.5px; }
.cov a { text-decoration: none; }
.cov a:hover { text-decoration: underline; }

/* ---------- Governance ---------- */
.keeps { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.keeps ul { list-style: none; margin: 8px 0 0; padding: 0; }
.keeps li { padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
.keeps .dim { font-size: 12.5px; display: block; }

/* ---------- Overlays ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,10,12,.28); z-index: 40; display: none; }
:root[data-theme="dark"] .scrim { background: rgba(0,0,0,.55); }
.scrim.on { display: block; }
.palette { position: fixed; z-index: 50; left: 50%; top: 14vh; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); background: var(--pane); box-shadow: var(--shadow); border-radius: 10px; display: none; overflow: hidden; }
.palette.on { display: block; }
.palette input { width: 100%; height: 50px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; padding: 0 18px; font: 15px var(--sans); color: var(--ink); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 360px; overflow: auto; }
.palette li a { display: flex; gap: 12px; align-items: center; padding: 0 12px; height: 38px; border-radius: 6px; text-decoration: none; }
.palette li a .dom { margin-left: auto; color: var(--ink-3); font-size: 12px; }
.palette li a.hi { background: var(--sunk); }
.palette .foot { border-top: 1px solid var(--rule); padding: 8px 16px; font-size: 12px; color: var(--ink-3); display: flex; gap: 14px; }

.setup { position: fixed; inset: 0; z-index: 45; background: var(--bg); display: none; overflow: auto; }
.setup.on { display: block; }
.setup-in { max-width: 520px; margin: 0 auto; padding: 56px 24px 64px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 18px 0 34px; }
.steps span { height: 2px; background: var(--rule-2); border-radius: 2px; }
.steps span.on { background: var(--ink); }
.setup h1 { font-size: 24px; letter-spacing: -.02em; }
.setup .lede { margin-top: 8px; }
.choice { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.choice label { display: flex; align-items: center; gap: 14px; min-height: 52px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.choice input { accent-color: var(--ink); width: 16px; height: 16px; }
.choice .sub { margin-left: auto; font-size: 12.5px; }
.field { display: grid; gap: 6px; margin-top: 20px; font-size: 12.5px; color: var(--ink-3); }
.field input { height: 40px; font: 15px var(--sans); color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule-2); padding: 0; outline: none; }

const P = id => PEOPLE.find(p => p.id === id);
const S = id => SPACES.find(s => s.id === id);
const A = id => ACTIONS.find(a => a.id === id);
const AG = id => AGENTS.find(a => a.id === id);

/* ---------- Shared logic: belief, reach ---------- */
// age -> highest position the evidence can still support. Crosses 3 at 120 s, 2 at 300 s, 1 at 900 s; gone at 1200 s.
function agePos(a) { const k = [[0,3.75],[120,3],[300,2],[900,1],[1200,0]]; if (a <= 0) return 3.75; for (let i=1;i<k.length;i++) if (a <= k[i][0]) { const [a0,p0]=k[i-1],[a1,p1]=k[i]; return p0 + (p1-p0)*(a-a0)/(a1-a0); } return 0; }
function vAt(ev, t) { let last = null; for (const e of ev) if (e.p != null && e.t <= t) last = e; if (!last) return 0; return Math.max(0, Math.min(last.p, agePos(t - last.t))); }
const lvOf = v => v >= 3 ? 3 : v >= 2 ? 2 : v >= 1 ? 1 : 0;
function untilOf(ev, now) { const l = lvOf(vAt(ev, now)); if (!l) return null; for (let s = 1; s < 1500; s++) if (lvOf(vAt(ev, now + s)) < l) return now + s; return null; }
function lastOf(ev, m, now) { let r = null; for (const e of ev) if (e.m === m && e.t <= now) r = e; return r; }
// Highest level a space can reach, from adopted, reporting sensors.
function spaceReach(sp, live = true) { const mods = new Set(SENSORS.filter(s => s.spaces.includes(sp) && (!live || s.health === 'ok')).map(s => s.mod)); return mods.size >= 2 ? 3 : mods.size === 1 ? 2 : 0; }
function personReach(p) { return p.voice && p.face ? 3 : (p.voice || p.face) ? 2 : 0; }
function hasRole(p, a) { return a.floor || (a.roles || []).some(r => p.roles.includes(r)); }
function allowed(p, a) { return a.floor || Object.values(CONSENT[p.id] || {}).some(l => l.includes(a.id)) || LIMITS.some(x => x.person === p.id && x.action === a.id); }
function spacesFor(a) { return SPACES.filter(s => spaceReach(s.id, false) >= a.need); }
function whoCan(a) { return PEOPLE.filter(p => hasRole(p, a) && allowed(p, a) && personReach(p) >= a.need); }

/* ---------- Components ---------- */
function ladder(l, size = 14) {
  const b = (x, y, w, on) => `<rect class="g${on ? ' on' : ''}" x="${x}" y="${y}" width="${w}" height="${13 - y}" rx="0.8"/>`;
  return `<svg class="ladder" width="${Math.round(size * 16 / 14)}" height="${size}" viewBox="0 0 16 14" aria-hidden="true">${b(0.5, 9, 3.4, l >= 1)}${b(5.3, 5.5, 3.4, l >= 2)}${b(10.1, 1.5, 2.1, l >= 3)}${b(13.3, 1.5, 2.1, l >= 3)}<path class="r" d="M0 13.5h16"/></svg>`;
}
const lvTag = (l, extra = '') => `<span class="lv" title="${LVD[l]}">${ladder(l)}<span>${LV[l]}${extra}</span></span>`;
const mark = k => k === 'ok'
  ? `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="currentColor"/><path d="M4.3 7.2 6.1 9l3.6-3.8" fill="none" stroke="var(--pane)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  : k === 'no'
  ? `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.6 7h4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`
  : k === 'warn'
  ? `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6 13 12.2H1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M7 5.6v3M7 10.2v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`
  : `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="2 2"/></svg>`;
const outcome = ok => `<span class="oc ${ok?'ok':'no'}">${mark(ok?'ok':'no')}${ok?'Allowed':'Refused'}</span>`;
const attn = text => `<span class="att">${mark('warn')}<span>${text}</span></span>`;
const modGlyph = (m, on = true) => m === 'voice'
  ? `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="${on?1:.4}"/></svg>`
  : `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.6" ${on?'fill="currentColor"':'fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"'}/></svg>`;

// Belief trace: x from -600 s to +240 s, y in level-position space.
function trace(ev, { w = 520, h = 150, mini = false, now = 0, id = '' } = {}) {
  const padL = mini ? 0 : 0, padR = mini ? 0 : 64, padT = mini ? 2 : 10, padB = mini ? 6 : 46;
  const x0 = -600, x1 = 240, pw = w - padL - padR, ph = h - padT - padB, ymax = 3.75;
  const X = t => padL + (t - (now + x0)) / (x1 - x0) * pw;
  const Y = v => padT + ph - (v / ymax) * ph;
  let past = '', fut = '';
  for (let t = now + x0; t <= now; t += 5) past += `${past ? 'L' : 'M'}${X(t).toFixed(1)} ${Y(vAt(ev, t)).toFixed(1)}`;
  // vertical step at each arrival
  past = ''; let prev = null;
  const pts = [];
  for (let t = now + x0; t <= now; t += 4) pts.push(t);
  for (const e of ev) if (e.p != null && e.t > now + x0 && e.t <= now) { pts.push(e.t - 0.01, e.t); }
  pts.push(now); pts.sort((a, b) => a - b);
  for (const t of pts) { const v = vAt(ev, t); past += `${past ? 'L' : 'M'}${X(t).toFixed(1)} ${Y(v).toFixed(1)}`; prev = v; }
  for (let t = now; t <= now + x1; t += 4) fut += `${fut ? 'L' : 'M'}${X(t).toFixed(1)} ${Y(vAt(ev, t)).toFixed(1)}`;
  const area = past + `L${X(now).toFixed(1)} ${Y(0)}L${X(now + x0).toFixed(1)} ${Y(0)}Z`;
  const vn = vAt(ev, now);
  let g = `<svg class="trace${mini ? ' mini' : ' big'}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${mini ? '' : 'How sure attest is over the last ten minutes'}"${id ? ` id="${id}"` : ''}>`;
  [1, 2, 3].forEach(l => {
    g += `<line class="th${l === 3 ? ' d' : ''}" x1="${padL}" x2="${padL + pw}" y1="${Y(l)}" y2="${Y(l)}"/>`;
    if (!mini) g += `<text class="tl" x="${padL + pw + 8}" y="${Y(l) + 3.5}">${LV[l]}</text>`;
  });
  g += `<line class="base" x1="${padL}" x2="${padL + pw}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  if (!mini) g += `<path class="area" d="${area}"/>`;
  g += `<path class="past" d="${past}"/><path class="fut" d="${fut}"/>`;
  g += `<line class="nowl" x1="${X(now)}" x2="${X(now)}" y1="${padT - 4}" y2="${Y(0)}"/>`;
  // modality ticks on the baseline
  for (const e of ev) { if (e.t < now + x0 || e.t > now) continue; const x = X(e.t), y = Y(0);
    if (mini) continue;
    if (e.m === 'voice') g += `<line class="tk-v" x1="${x}" x2="${x}" y1="${y + 5}" y2="${y + 12}"/>`;
    else g += e.p == null ? `<circle class="tk-x" cx="${x}" cy="${y + 21}" r="2.6"/>` : `<circle class="tk-f" cx="${x}" cy="${y + 21}" r="2.6"/>`;
  }
  if (!mini) {
    g += `<text class="tl" x="${padL + pw + 8}" y="${Y(0) + 12}">voice</text><text class="tl" x="${padL + pw + 8}" y="${Y(0) + 24.5}">face</text>`;
    g += `<text class="ax" x="${padL}" y="${h - 1}">${hm(now + x0)}</text><text class="ax" x="${X(now - 300)}" y="${h - 1}" text-anchor="middle">${hm(now - 300)}</text><text class="ax" x="${X(now)}" y="${h - 1}" text-anchor="middle" style="fill:var(--live)">now</text><text class="ax" x="${padL + pw}" y="${h - 1}" text-anchor="end">${hm(now + x1)}</text>`;
  }
  g += `<circle class="halo" cx="${X(now)}" cy="${Y(vn)}" r="${mini ? 2.5 : 3.5}"/><circle class="head" cx="${X(now)}" cy="${Y(vn)}" r="${mini ? 2.5 : 3.5}"/>`;
  if (!mini) g += `<line class="hov" x1="0" x2="0" y1="${padT}" y2="${Y(0)}" style="display:none"/>`;
  g += `</svg>`;
  return g;
}
function traceLegend() { return `<div class="legend"><span><svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 2v8" stroke="var(--ink-2)" stroke-width="1.6" stroke-linecap="round"/></svg>Voice heard</span><span><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.8" fill="var(--ink-2)"/></svg>Face seen</span><span><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="2.8" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/></svg>Face, no match</span><span><svg width="22" height="12" viewBox="0 0 22 12"><path d="M1 6h20" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/></svg>If nothing new arrives</span></div>`; }

/* ---------- Presence ---------- */
function presenceRow(p) {
  const v = vAt(p.ev, tick), l = lvOf(v), u = untilOf(p.ev, tick);
  const lv = lastOf(p.ev, 'voice', tick), lf = lastOf(p.ev, 'face', tick);
  const fr = [lv && `voice ${short(tick - lv.t)}`, lf && lf.p != null && tick - lf.t < 900 && `face ${short(tick - lf.t)}`].filter(Boolean).join(' · ');
  return `<a class="row r-pres" href="#presence/${p.id}" ${route.id === p.id ? 'aria-current="true"' : ''} data-live="${p.id}">
    <span class="c-n name">${p.short}</span><span class="c-l">${lvTag(l)}</span><span class="c-t">${trace(p.ev, { w: 116, h: 28, mini: true, now: tick })}</span>

}
function vPresence() {

    }

/* ---------- Decisions ---------- */

/* live clock: only the trace moves */

    document.querySelectorAll('[data-live]').forEach(a => { const p = P(a.dataset.live); const t = a.querySelector('.c-t'); if (t) t.innerHTML = trace(p.ev, { w: 116, h: 28, mini: true, now: tick }); });
    const bt = document.getElementById('bigtrace'); if (bt) { const p = P(bt.dataset.person); bt.innerHTML = trace(p.ev, { w: 392, h: 160, now: tick, id: 'tr-big' }); wireTrace(); }
  }
}
if (!STILL) setInterval(liveTick, 1000);

function wireTrace() {
  const svg = document.getElementById('tr-big'), out = document.getElementById('readout'); if (!svg || !out) return;
  const p = P(document.getElementById('bigtrace').dataset.person), hov = svg.querySelector('.hov');
  const pw = 392 - 64;
  svg.onmousemove = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) * 392 / r.width; if (x < 0 || x > pw) return; const t = tick - 600 + x / pw * 840; const l = lvOf(vAt(p.ev, t)); hov.setAttribute('x1', x); hov.setAttribute('x2', x); hov.style.display = ''; out.textContent = `${clock(t)} · ${LV[l]}${t > tick ? ' (if nothing new arrives)' : ''}`; };
  svg.onmouseleave = () => { hov.style.display = 'none'; out.textContent = ''; };
}

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal.classList.contains('on') ? closePalette() : openPalette(); return; }
  if (e.key === 'Escape') { if (pal.classList.contains('on')) { closePalette(); return; } if (document.getElementById('sheet').classList.contains('on')) { closeSheet(); return; } if (parse().d === 'setup') { location.hash = '#connections'; return; } if (route.id && route.d !== 'governance' && route.d !== 'connections') location.hash = '#' + route.d; return; }
  if (/input|select|textarea/i.test(e.target.tagName) || menu) return;
  if (e.key === 'g') { gWait = Date.now(); return; }
  if (Date.now() - gWait < 900) { const d = DOMAINS.concat(SECONDARY).find(x => x.key === e.key); if (d) { location.hash = '#' + d.id; gWait = 0; } return; }
  if ((e.key === 'j' || e.key === 'k') && !e.metaKey) { const rows = [...document.querySelectorAll('.master a.row, .master td.act a')]; if (!rows.length) return; let i = rows.findIndex(r => r.getAttribute('aria-current') === 'true' || r.closest('tr.cur')); i = e.key === 'j' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1); location.hash = rows[i].getAttribute('href'); }
});

render(false);
})();
</script>
</body>
